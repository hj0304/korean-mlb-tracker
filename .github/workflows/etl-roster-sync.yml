name: etl-roster-sync

# Keeps the players roster fresh: current team/level, plus the teams table that
# game/season rows resolve opponent and team names against. Runs at 06:00 UTC ==
# 15:00 KST, an hour before daily_games/season_stats (07:00 UTC), so a call-up or
# option is reflected in current_team_id before daily_games filters that day's
# games by team. GitHub Actions cron is UTC.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  roster-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run roster_sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: uv run python -m app.jobs.run --job=roster_sync
