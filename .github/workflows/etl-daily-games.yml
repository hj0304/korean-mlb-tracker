name: etl-daily-games

# Keeps game_logs fresh: syncs yesterday's completed games once a day.
# Runs at 08:00 UTC == 17:00 KST, after the whole US slate (incl. west-coast and
# extra-innings games) has finished (~06:00-06:30 UTC). Running earlier — e.g. at
# KST noon — fires mid-US-night, so the games aren't Final yet and get skipped,
# leaving the KST-dated feed a day stale. GitHub Actions cron is UTC.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to sync (default: yesterday)'
        required: false

jobs:
  daily-games:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run daily_games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: uv run python -m app.jobs.run --job=daily_games ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
