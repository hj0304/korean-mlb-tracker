name: etl-daily-games

# Keeps game_logs fresh: syncs yesterday's completed games once a day.
# GitHub Actions cron is UTC; 03:00 UTC == 12:00 KST.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to sync (default: yesterday)'
        required: false

jobs:
  daily-games:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run daily_games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: uv run python -m app.jobs.run --job=daily_games ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
