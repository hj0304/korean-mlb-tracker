name: etl-daily-games

# Keeps game_logs fresh: syncs yesterday's completed games once a day.
# Runs at 07:00 UTC == 16:00 KST, after the whole US slate has finished. The
# latest-ending games are west-coast night games (incl. MiLB Pacific) starting
# ~02:15 UTC; even extra-inning ones end ~05:55 UTC, so 07:00 leaves a ~1h margin
# for marathons. Running earlier — e.g. KST noon — fires mid-US-night, so games
# aren't Final yet and get skipped, leaving the KST-dated feed a day stale.
# GitHub Actions cron is UTC.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to sync (default: yesterday)'
        required: false

jobs:
  daily-games:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run daily_games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
        run: uv run python -m app.jobs.run --job=daily_games ${{ inputs.date && format('--date={0}', inputs.date) || '' }}
